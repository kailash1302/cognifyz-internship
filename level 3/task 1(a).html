<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerful Anime Characters Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

       
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .gallery a {
            display: block;
            width: 350px;
            height: 200px;
        }
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }

       
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
        .lightbox:target {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <h2>Powerful Anime Characters Gallery</h2>
    <div class="gallery">
        <a href="#kakashi"><img src="https://framerusercontent.com/images/oEP6XuKT91CkfZ4v5VzvS65xPNI.jpg" alt="Kakashi"></a>
        <a href="#naruto"><img src="https://i.pinimg.com/736x/79/2d/a7/792da78023d8a2c9a36485c84fc63fd9.jpg" alt="Naruto"></a>
        <a href="#itachi"><img src="https://wallpapers.com/images/hd/itachi-mangekyou-sharingan-kbuo0aq5ucbtuufl.jpg" alt="Itachi"></a>
        <a href="#hashirama"><img src="https://static1.cbrimages.com/wordpress/wp-content/uploads/2022/03/hashirama-from-naruto.jpg" alt="Hashirama"></a>
    </div>

    <div id="kakashi" class="lightbox" onclick="window.location='#'">
        <img src="https://framerusercontent.com/images/oEP6XuKT91CkfZ4v5VzvS65xPNI.jpg">
    </div>
    <div id="naruto" class="lightbox" onclick="window.location='#'">
        <img src="https://i.pinimg.com/736x/79/2d/a7/792da78023d8a2c9a36485c84fc63fd9.jpg">
    </div>
    <div id="itachi" class="lightbox" onclick="window.location='#'">
        <img src="https://wallpapers.com/images/hd/itachi-mangekyou-sharingan-kbuo0aq5ucbtuufl.jpg">
    </div>
    <div id="hashirama" class="lightbox" onclick="window.location='#'">
        <img src="https://static1.cbrimages.com/wordpress/wp-content/uploads/2022/03/hashirama-from-naruto.jpg">
    </div>
</body>
</html>
