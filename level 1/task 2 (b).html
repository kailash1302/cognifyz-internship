<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time-Based Greeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Smooth Background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background 0.5s ease-in-out;
            text-align: center;
        }

        /* Greeting Container */
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        /* Button Styling */
        button {
            background: #ff7eb3;
            border: none;
            padding: 15px 30px;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff4d6d;
            box-shadow: 0px 0px 10px rgba(255, 78, 78, 0.5);
        }
    </style>
</head>
<body onload="showGreeting()">
    <div class="container">
        <h1>Click Below to See Your Greeting</h1>
        <button onclick="showGreeting()">Get Greeting</button>
    </div>

    <script>
        function showGreeting() {
            let hours = new Date().getHours();
            let message = "";

            if (hours < 12) {
                message = "🌅 Good Morning! Have a fresh start!";
                document.body.style.background = "linear-gradient(120deg, #ff9a9e, #fad0c4)";
            } else if (hours < 18) {
                message = "☀️ Good Afternoon! Keep going strong!";
                document.body.style.background = "linear-gradient(120deg, #a1c4fd, #c2e9fb)";
            } else {
                message = "🌙 Good Evening! Time to relax!";
                document.body.style.background = "linear-gradient(120deg, #355c7d, #6c5b7b, #c06c84)";
            }

            
            alert(message);
        }
    </script>
</body>
</html>
