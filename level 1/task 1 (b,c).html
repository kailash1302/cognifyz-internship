<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://wallpapers.com/images/featured/ipl-2021-ix7zwgff29ylomuf.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .nav-menu {
            background: rgba(0, 0, 0, 0.7);
            width: 100%;
            text-align: center;
            padding: 10px 0;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 18px;
        }
        .nav-menu a:hover {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            background: #ff9800;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #e68900;
        }
    </style>
</head>
<body>
    <div class="nav-menu">
        <a href="#">Home</a>
        <a href="#">Teams</a>
        <a href="#">Contact</a>
    </div>
    <div class="content">
        <div class="form-container">
            <h2>IPL Match Prediction</h2>
            <form>
                <label for="team">Select Winning Team:</label>
                <select id="team" name="team" required>
                    <option value="">-- Select Team --</option>
                    <option value="CSK">Chennai Super Kings</option>
                    <option value="MI">Mumbai Indians</option>
                    <option value="RCB">Royal Challengers Bangalore</option>
                    <option value="KKR">Kolkata Knight Riders</option>
                    <option value="SRH">Sunrisers Hyderabad</option>
                    <option value="DC">Delhi Capitals</option>
                    <option value="PBKS">Punjab Kings</option>
                    <option value="RR">Rajasthan Royals</option>
                    <option value="LSG">Lucknow Super Giants</option>
                    <option value="GT">Gujarat Titans</option>
                </select>
                
                <button type="submit">Submit Prediction</button>
            </form>
        </div>
    </div>
</body>
</html>
