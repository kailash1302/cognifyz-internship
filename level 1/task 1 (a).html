<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Tribute - Gol D. Roger & Ace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            color: #FFD700; /* One Piece gold color */
            font-size: 36px;
            text-shadow: 2px 2px 5px black;
        }
        p {
            font-size: 18px;
            max-width: 600px;
            margin: 10px auto;
            color: #ff4500; 
            text-shadow: 1px 1px 3px black;
        }
        .image-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        img {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <h1>Tribute to Gol D. Roger & Portgas D. Ace</h1>
    <p>Legends never die. Gol D. Roger, the Pirate King, and his son, Portgas D. Ace, left their mark on history. 
        Their legacy lives on through the dreams of the next generation.</p>
    <div class="image-container">
        <img src="https://i.pinimg.com/736x/6f/03/91/6f03915bcaae7935b8a558ef7168a91d.jpg" alt="Gol D. Roger Tribute">
        <img src="https://img.artpal.com/523782/27-23-7-18-20-33-47m.jpg" alt="Fire Fist Ace Tribute">
    </div>
</body>
</html>
